[project]
name = "gemini-act"
version = "0.1.0"
description = "A Google ADK agent that takes real actions from inside Google Chat"
readme = "README.md"
authors = [
    { name = "Radan Petrica", email = "petrica.radan@formare.ai" }
]
requires-python = ">=3.12"
dependencies = [
    "google-adk[gcp,mcp,a2a,agent-identity]>=2.6.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "google-auth>=2.38",
    "google-auth-oauthlib>=1.2",
    "google-api-python-client>=2.160",
    # Transitively present via google-api-python-client, but imported directly
    # in chat/client.py to give each request its own transport, so declared.
    "google-auth-httplib2>=0.2",
    "pydantic-settings>=2.7",
    "google-cloud-firestore>=2.20",
    "itsdangerous>=2.2",
    # Runtime, not just tests: the property tools under `imobiliare_mcp/` and the
    # Maps calls in `imobiliare_mcp/maps.py` use it directly. The system python
    # on macOS ships without CA certificates, which is why that package uses
    # httpx (bundles certifi) rather than urllib — see imobiliare_mcp/CLAUDE.md.
    "httpx>=0.28",
    # Folds a listing's gallery into one contact sheet (`imobiliare_mcp/galerie.py`).
    # Optional at import time — the sheet is skipped if it is missing — but the
    # report is meaningfully worse without it, so it is declared.
    "pillow>=11.0",
    "reportlab>=5.0.1",
    "python-docx>=1.2.0",
    # Text out of the reference PDFs in the Drive folder
    # (`imobiliare_mcp/drive_docs.py`). Load-bearing rather than optional:
    # reading those documents is the whole point of that module.
    "pypdf>=6.18.1",
]

[project.scripts]
gemini-act = "gemini_act.chat.app:main"
imobiliare-mcp = "gemini_act.imobiliare_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gemini_act"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The valuation engine and its report renderer are vendored from a standalone
# MCP server (see src/gemini_act/imobiliare_mcp/CLAUDE.md) and were written to a
# wider line budget. Their long lines are almost entirely Romanian report
# strings and the GEV 630 adjustment table, where the existing line breaks track
# the standard's own structure — rewrapping them would be a large diff through
# working valuation logic for no reading benefit, and would fight the next
# update from upstream.
#
# Only E501 is waived, and only here: every other rule applies to this package
# as it does everywhere else, and new modules in it (maps.py, viziune.py) are
# held to the project's 100-column limit.
"src/gemini_act/imobiliare_mcp/anevar.py" = ["E501"]
"src/gemini_act/imobiliare_mcp/comps.py" = ["E501"]
"src/gemini_act/imobiliare_mcp/locatie.py" = ["E501"]
"src/gemini_act/imobiliare_mcp/raport.py" = ["E501"]
"src/gemini_act/imobiliare_mcp/server.py" = ["E501"]
