# Builds the dsh + imobiliare image with the REPO ROOT as context.
#
# The context has to be the repo root because the Dockerfile copies
# src/gemini_act to install the imobiliare-mcp entry point, so the default
# `gcloud builds submit --tag` (which expects ./Dockerfile at the context root)
# is not usable here.
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=deploy/dsh/Dockerfile
      - --tag=${_IMAGE}
      - .
images:
  - ${_IMAGE}
options:
  # The Python install plus the npm global install exceed the default machine's
  # comfortable build time.
  machineType: E2_HIGHCPU_8
timeout: 1200s
