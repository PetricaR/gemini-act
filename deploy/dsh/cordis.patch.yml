# dsh home-level patch layer, seeded to $DSH_HOME/cordis.patch.yml.
#
# Registers gemini-act's imobiliare MCP server so its 18 tools become native
# tools in the dsh Web UI, named mcp__imobiliare__<tool> — cauta, evaluare,
# inspecteaza_poze, analizeaza_strada_si_imprejurimi_street_view,
# genereaza_raport_complet_pdf, and the rest.
#
# stdio, not streamable-http: the server is spawned as a child process inside
# the same container, so it is never exposed on the network. server.py's
# main() calls mcp.run() with no transport argument, which is stdio.

- id: mcp-imobiliare
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: imobiliare
    transport: stdio
    command: imobiliare-mcp
    args: []
    # The MCP client scrubs ambient env and merges only what is listed here.
    # These are read by gemini_act.config.Settings, which uses the GEMINI_ACT_
    # prefix; its env_file is cwd-relative and there is no .env in the image,
    # so every value must arrive through the environment.
    env:
      GEMINI_ACT_MAPS_API_KEY: !!js process.env.GEMINI_ACT_MAPS_API_KEY
      GEMINI_ACT_TARGETARE_API_KEY: !!js process.env.GEMINI_ACT_TARGETARE_API_KEY
      GEMINI_ACT_IMOBILIARE_SESSION_ID: !!js process.env.GEMINI_ACT_IMOBILIARE_SESSION_ID
      # Used by the vision tools (viziune.py, viziune_strada.py) for image and
      # Street View analysis — separate from whichever model drives the chat.
      GEMINI_API_KEY: !!js process.env.GEMINI_API_KEY
