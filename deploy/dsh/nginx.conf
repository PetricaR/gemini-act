# Reverse proxy fronting dsh inside the container.
#
# dsh refuses --host 0.0.0.0 (packages/bundle/web-app/src/startup.ts) because
# its web server would expose remote code execution to the network. Cloud Run
# requires a listener on all interfaces, so nginx takes that role and dsh stays
# on loopback. The control that replaces the guard is IAP: only principals
# holding roles/iap.httpsResourceAccessor reach nginx at all. If that binding
# is widened, this becomes a reachable RCE endpoint.

worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  access_log /dev/stdout;

  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  # Required for the WebSocket upgrade dance; dsh's UI holds a live socket.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Attach the launch token unless this request is the one dsh just redirected
  # us to (marked ?authed=1 by the proxy_redirect in `location = /`).
  #
  # This condition is load-bearing. On seeing the token dsh sets its cookie and
  # answers 303 to a clean URL. Attaching it unconditionally makes the browser
  # follow that 303 back to "/", nginx re-add the token, and dsh 303 again — an
  # infinite redirect Chrome aborts with ERR_TOO_MANY_ACCEPT_CH_RESTARTS.
  #
  # Keying on the redirect marker rather than on the presence of a dsh-auth-
  # cookie is deliberate. The cookie's signing secret does not survive every
  # restart, so a browser holding a stale cookie would suppress the token, dsh
  # would reject the stale cookie, and every /api/* call would 403 with no way
  # out short of clearing cookies by hand. The marker cannot go stale: a fresh
  # navigation always carries the token and always mints a new session.
  map $arg_authed $dsh_autologin_qs {
    "1"      "";
    default  "__DSH_AUTOLOGIN_QS__";
  }

  server {
    listen 8080;
    server_name _;

    # Agent turns run far longer than nginx's 60s default, and a tool call can
    # sit silent for minutes. Matches the Cloud Run request timeout.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    client_max_body_size 100m;

    # Set once at server level; both locations below inherit these.
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # Pass the real Host through. dsh runs a Host/Origin fence on every /api
    # request (packages/client/connection/src/api-request-trust.ts) that exists
    # to stop DNS rebinding and cross-site calls. Rewriting Host to the loopback
    # address while the browser still sends its own Origin is precisely the
    # cross-site mismatch the fence rejects — it answers 403 to every /api call
    # while static assets keep loading. The supported way to run behind a proxy
    # is to leave Host alone and declare the public authority to dsh with
    # --trusted-host (see entrypoint.sh).
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Token streaming arrives incrementally; buffering would batch it into one
    # late response and make the UI look frozen.
    proxy_buffering off;
    proxy_cache off;

    # Exact match on "/" only: the entry point. $dsh_autologin_qs is the token
    # query on a fresh navigation, and empty on dsh’s own redirect back here.
    #
    # An INTERNAL rewrite, deliberately not a browser redirect: the token is
    # attached when proxying upstream, so the address bar never shows it.
    location = / {
      proxy_pass http://127.0.0.1:3080/$dsh_autologin_qs;

      # Tag dsh's post-token 303 so the follow-up request is recognisable and
      # does not get the token attached again. Matches a Location of exactly
      # "/", relative or absolute against either the forwarded Host or the
      # loopback address. Scoped to this location so no other redirect is
      # rewritten.
      proxy_redirect ~^(?:https?://[^/]+)?/$ /?authed=1;

      # The entry point must never be cached. It is the only request that
      # carries the launch token upstream and establishes the session cookie;
      # a cached copy skips that exchange entirely, and every subsequent
      # /api/* call is then refused 403 with no obvious cause.
      add_header Cache-Control "no-store, no-cache, must-revalidate" always;
      add_header Pragma "no-cache" always;
    }

    location / {
      proxy_pass http://127.0.0.1:3080;
    }
  }
}
