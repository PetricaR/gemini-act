# Reverse proxy fronting dsh inside the container.
#
# dsh refuses --host 0.0.0.0 (packages/bundle/web-app/src/startup.ts) because
# its web server would expose remote code execution to the network. Cloud Run
# requires a listener on all interfaces, so nginx takes that role and dsh stays
# on loopback. The control that replaces the guard is IAP: only principals
# holding roles/iap.httpsResourceAccessor reach nginx at all. If that binding
# is widened, this becomes a reachable RCE endpoint.

worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  access_log /dev/stdout;

  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  # Required for the WebSocket upgrade dance; dsh's UI holds a live socket.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 8080;
    server_name _;

    # Agent turns run far longer than nginx's 60s default, and a tool call can
    # sit silent for minutes. Matches the Cloud Run request timeout.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    client_max_body_size 100m;

    # Set once at server level; both locations below inherit these.
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # Pass the real Host through. dsh runs a Host/Origin fence on every /api
    # request (packages/client/connection/src/api-request-trust.ts) that exists
    # to stop DNS rebinding and cross-site calls. Rewriting Host to the loopback
    # address while the browser still sends its own Origin is precisely the
    # cross-site mismatch the fence rejects — it answers 403 to every /api call
    # while static assets keep loading. The supported way to run behind a proxy
    # is to leave Host alone and declare the public authority to dsh with
    # --trusted-host (see entrypoint.sh).
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Token streaming arrives incrementally; buffering would batch it into one
    # late response and make the UI look frozen.
    proxy_buffering off;
    proxy_cache off;

    # Plain pass-through. An earlier version injected dsh's launch token here so
    # a bare "/" logged the operator in. It was removed: dsh answers the token
    # with a 303 to a clean URL, and every scheme for suppressing the token on
    # the way back — a cookie probe, a query marker, rewriting Location —
    # either fought that redirect or went stale, producing in turn an infinite
    # redirect, blanket 403s, and a redirect the browser could not follow.
    #
    # Authentication is now dsh's own, unmodified: open the URL it prints, with
    # ?token=..., once per container start. entrypoint.sh logs that URL against
    # the public hostname. IAP still gates who can reach this at all, so the
    # token is a second layer rather than the only one.
    location / {
      proxy_pass http://127.0.0.1:3080;

      # The entry point must never be cached: a cached copy skips the token
      # exchange, leaving a page whose every /api/* call is refused 403.
      add_header Cache-Control "no-store, no-cache, must-revalidate" always;
      add_header Pragma "no-cache" always;
    }
  }
}
