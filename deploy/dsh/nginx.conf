# Reverse proxy fronting dsh inside the container.
#
# dsh refuses --host 0.0.0.0 (packages/bundle/web-app/src/startup.ts) because
# its web server has no authentication and exposing it to a network would
# expose remote code execution. Cloud Run requires a listener on all
# interfaces, so nginx takes that role and dsh stays on loopback.
#
# The safety property that replaces the guard is IAP: the service is deployed
# --no-allow-unauthenticated --iap, and only principals holding
# roles/iap.httpsResourceAccessor reach nginx at all. If that binding is ever
# widened, this becomes an unauthenticated RCE endpoint.

worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  access_log /dev/stdout;

  # Cloud Run's own paths must stay writable by a non-root process.
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  # Required for the WebSocket upgrade dance; dsh's UI holds a live socket.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 8080;
    server_name _;

    # Agent turns run far longer than nginx's 60s default, and a tool call can
    # sit silent for minutes. Matches the Cloud Run request timeout.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    client_max_body_size 100m;

    location / {
      proxy_pass http://127.0.0.1:3080;
      proxy_http_version 1.1;

      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Token streaming arrives incrementally; buffering would batch it into
      # one late response and make the UI look frozen.
      proxy_buffering off;
      proxy_cache off;
    }
  }
}
