# dsh settings, seeded into the state bucket and restored into $DSH_HOME at
# boot by entrypoint.sh.
#
# Configures Gemini as a provider route so the harness runs on Gemini rather
# than DeepSeek. dsh is DeepSeek's harness, but the model driving the loop is
# whatever is configured here — the two are independent.
#
# apiKeyEnv rather than a stored credential: the deploy injects GEMINI_API_KEY
# from Secret Manager, so the key never lands in this file or in the bucket.

llm-pi-ai:
  providers:
    gemini:
      # Google's OpenAI-compatible endpoint, so the openai wire protocol
      # applies rather than a Gemini-native one.
      api: openai-completions
      baseURL: https://generativelanguage.googleapis.com/v1beta/openai
      apiKeyEnv: GEMINI_API_KEY
      # Images are needed: the imobiliare tools analyse listing photos and
      # Street View captures (viziune.py, viziune_strada.py), and a text-only
      # route would refuse those turns.
      defaultInput: [text, image]
      models:
        - id: gemini-3.8-flash
          input: [text, image]
