# Hermes Agent configuration, seeded into the Cloud Run state bucket before
# first boot by deploy_cloud_run.sh.
#
# This is NOT gemini-act configuration. Hermes is a separate, self-hosted agent
# (Nous Research, MIT) with its own model and loop; it reaches gemini-act's
# tools over MCP rather than running its own ADK agent. See README.md.

model:
  # Gemini through Google's OpenAI-compatible endpoint. The API key comes from
  # the GEMINI_API_KEY env var, injected from Secret Manager by the deploy.
  default: gemini-3.8-flash
  provider: gemini
  base_url: https://generativelanguage.googleapis.com/v1beta/openai

database:
  # `delete`, not the default `wal`, because on Cloud Run this directory is a
  # GCS bucket mounted through FUSE. WAL needs mmap and POSIX file locking,
  # neither of which GCS FUSE provides; Hermes documents `delete` as the mode
  # for network mounts. Getting this wrong corrupts state.db rather than
  # failing loudly, which is why the file is uploaded *before* first boot.
  #
  # An existing WAL database is never live-downgraded. If state.db was already
  # created in WAL mode, stop every Hermes process and run a one-time offline
  # `PRAGMA journal_mode=DELETE` on it, or this setting is silently ignored.
  journal_mode: delete
